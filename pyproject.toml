[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubernetes-citation-rag"
version = "0.1.0"
description = "Evaluation-first citation RAG over the official Kubernetes documentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "openai>=1.50,<3",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "rank-bm25>=0.2.2,<1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[tool.setuptools.packages.find]
include = ["app*", "rag*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
